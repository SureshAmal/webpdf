<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipHTML5 → PDF</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 16px; color: #111; }
  .center { max-width: 760px; margin: 0 auto; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; }
  input { width: 60%; min-width: 260px; padding: 8px; font-size: 15px; box-sizing: border-box; }
  button { padding: 8px 14px; font-size: 15px; cursor: pointer; }
  #status { color: #555; min-height: 1.4em; margin-top: 12px; }
  #downloads { position: fixed; top: 12px; right: 12px; display: none; gap: 8px; }
  #downloads button { padding: 8px 12px; }
  #preview { max-width: 820px; margin: 24px auto; }
  #preview img { width: 100%; display: block; margin: 10px auto; border: 1px solid #ccc; }
</style>
</head>
<body>
  <div id="downloads">
    <button id="download-optimized" disabled>Download optimized PDF</button>
    <button id="download-large" disabled>Download large PDF</button>
  </div>

  <div class="center">
    <h1>FlipHTML5 → PDF</h1>
    <p>
      <input id="url" type="url" placeholder="https://online.fliphtml5.com/user/book/" autocomplete="off">
      <button id="go">Go</button>
    </p>
    <div id="status"></div>
  </div>

  <div id="preview"></div>

  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
